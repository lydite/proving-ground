# The service is named `postgres` while go/api/compose.yaml names its own `db`.
# The names differ and the published host port does not: the scheduler has to
# serialise these two components on the port, which a name-keyed lock would miss.
services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: tally
      POSTGRES_PASSWORD: tally
      POSTGRES_DB: tally
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tally -d tally"]
      interval: 2s
      timeout: 3s
      retries: 15
