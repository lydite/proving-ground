# The component declaration this repository exists to exercise, following
# ADR 0016 in lydite/lydite.
#
# A component is the unit its build tool treats as a whole. rust/ is one Cargo
# workspace of three crates and so one component, even though tally-cli is the
# only deployable in it; web/ is one npm workspace of two packages sharing one
# node_modules. go/api and go/sdk are separate modules with separate version
# lines, which is the case where splitting genuinely is correct.

components:
  - name: tally
    dir: rust
    runner: cargo-nextest
    # --run-ignored=all reaches the test that needs the compose service below.
    # Without it the service declaration would be decorative: nothing in the
    # suite would ever connect, and removing the compose block would change
    # nothing observable.
    args: ["--workspace", "--run-ignored=all"]
    # Makefile and VERSION sit under no component, and tally-cli embeds VERSION.
    watch: ["Makefile", "VERSION"]
    compose:
      file: ./compose.yaml
      up: [postgres]
      wait: healthy

  - name: api
    dir: go/api
    runner: go-test
    args: ["./..."]
    compose:
      file: ./compose.yaml
      up: [db]
      wait: healthy
    env:
      PROVING_GROUND_PG: "1"

  - name: sdk
    dir: go/sdk
    runner: go-test
    args: ["./..."]
    # The client is derived from the spec api emits; no tool sees that edge.
    depends_on: [api]
    watch: ["docs/openapi.json"]

  - name: web
    dir: web
    runner: vitest
    # No args: the vitest runner supplies `run` itself, because a bare
    # `vitest` starts watch mode and must never be a CI default. A second
    # `run` here is not ignored — vitest reads a positional argument as a
    # filename filter, so it selects no test file and the component fails
    # with "No test files found".
    depends_on: [api]
    watch: ["docs/openapi.json"]

# generated/client.ts is derived from docs/openapi.json and tested by nobody.
# Excluding it is the reviewable statement that somebody decided that, and it is
# the half of the orphan gate scripts/seed.ts cannot demonstrate: one file proves
# the gate fires, and it takes a second to prove an exclude clears it.
excludes: ["generated/**"]
